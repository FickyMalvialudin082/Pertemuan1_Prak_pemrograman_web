<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Tugas Saya</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="todo-app">
    <h2>Daftar Tugas Saya</h2>

    <form id="todoForm">
      <div class="input-section">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="Tuliskan tugas baru..." 
          autocomplete="off"
        />
        <button type="submit" class="add-btn">Tambah</button>
      </div>
      <p id="inputError" class="error-message">
        Tugas tidak boleh kosong atau kurang dari 3 karakter!
      </p>
    </form>

    <!-- Fitur 1: Task Counter -->
    <div id="taskCounter" class="task-counter"></div>

    <ul id="todoList" class="todo-list"></ul>

    <!-- Fitur 2: Tombol Bersihkan Tugas Selesai -->
    <div class="footer-actions">
      <button id="clearCompletedBtn" class="clear-btn">
        Bersihkan Tugas Selesai
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
